<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montre — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grain"></div>

  <button class="btn-toggle" id="themeToggle" aria-label="Changer le thème">
    <span id="toggle-icon">☾</span>
  </button>

  <main>
    <div class="clock-wrap">

      <header class="clock-header">
        <p class="eyebrow">heure locale</p>
        <h1 class="clock-date" id="date-display">—</h1>
      </header>

      <div class="time-display">
        <div class="time-block">
          <span class="time-digit" id="hour-num">00</span>
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100" class="ring-svg">
              <circle class="ring-bg" cx="50" cy="50" r="44"/>
              <circle class="ring-fill" id="ring-h" cx="50" cy="50" r="44"/>
            </svg>
          </div>
          <span class="time-unit">h</span>
        </div>

        <div class="sep">
          <span></span>
          <span></span>
        </div>

        <div class="time-block">
          <span class="time-digit" id="min-num">00</span>
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100" class="ring-svg">
              <circle class="ring-bg" cx="50" cy="50" r="44"/>
              <circle class="ring-fill" id="ring-m" cx="50" cy="50" r="44"/>
            </svg>
          </div>
          <span class="time-unit">min</span>
        </div>

        <div class="sep">
          <span></span>
          <span></span>
        </div>

        <div class="time-block">
          <span class="time-digit" id="sec-num">00</span>
          <div class="ring-wrap">
            <svg viewBox="0 0 100 100" class="ring-svg">
              <circle class="ring-bg" cx="50" cy="50" r="44"/>
              <circle class="ring-fill" id="ring-s" cx="50" cy="50" r="44"/>
            </svg>
          </div>
          <span class="time-unit">sec</span>
        </div>
      </div>

      <div class="day-progress">
        <div class="progress-meta">
          <span>Progression du jour</span>
          <span id="progress-pct" class="pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="day-bar"></div>
        </div>
      </div>

      <footer class="clock-footer">
        <div class="location-block" id="location-block">
          <span class="loc-icon">⌖</span>
          <span class="loc-text" id="loc-text">Localisation…</span>
        </div>
        <div class="tz-block">
          <span class="tz-name" id="tz-name">—</span>
          <span class="tz-offset" id="tz-offset">UTC+0</span>
        </div>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
