<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montre Élégante</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="d-flex align-items-center justify-content-center min-vh-100 px-3">
    <div class="clock-card">

      <!-- Header -->
      <div class="clock-header d-flex align-items-center justify-content-between mb-4">
        <div>
          <p class="clock-label mb-0">HEURE LOCALE</p>
          <p class="clock-date mb-0" id="date-display">—</p>
        </div>
        <!-- Dark / Light toggle -->
        <button class="btn-toggle" id="themeToggle" aria-label="Changer le thème">
          <i class="fas fa-moon" id="toggle-icon"></i>
        </button>
      </div>

      <!-- Time display -->
      <div class="time-row d-flex align-items-center justify-content-center gap-3">

        <div class="time-block text-center">
          <span class="time-digit" id="hour-num">00</span>
          <span class="time-unit">Heures</span>
        </div>

        <div class="time-sep d-flex flex-column gap-2">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <div class="time-block text-center">
          <span class="time-digit" id="min-num">00</span>
          <span class="time-unit">Minutes</span>
        </div>

        <div class="time-sep d-flex flex-column gap-2">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>

        <div class="time-block text-center">
          <span class="time-digit" id="sec-num">00</span>
          <span class="time-unit">Secondes</span>
        </div>

      </div>

      <!-- AM/PM badge + progress bar -->
      <div class="clock-footer d-flex align-items-center justify-content-between mt-4">
        <span class="ampm-badge" id="am-pm">AM</span>
        <div class="day-progress flex-grow-1 mx-3" title="Progression de la journée">
          <div class="day-progress-bar" id="day-bar"></div>
        </div>
        <span class="progress-label" id="progress-pct">0%</span>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
